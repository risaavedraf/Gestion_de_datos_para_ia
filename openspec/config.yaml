schema: spec-driven

context: |
  Project: Gestion_de_datos_para_ia (ITY1101 - Duoc UC)
  Type: DataOps pipeline for credit card fraud detection
  Stack: Python 3.11, FastAPI 0.104+, Pydantic v2, SQLAlchemy 2.0, psycopg2-binary
  Frontend: Vanilla JS + HTML/CSS (no framework, served by FastAPI StaticFiles)
  Database: PostgreSQL 15 (Docker), SQLite fallback for CI
  Data: CSV → Parquet Lakehouse (Bronze/Silver/Gold) with PyArrow, Pandas
  ML: scikit-learn, XGBoost, imbalanced-learn (train/predict in pipeline)
  Infrastructure: Docker multi-stage build, docker-compose, GitHub Actions CI, Render deploy
  Architecture: Lakehouse medallion (Bronze→Silver→Gold→Load) + FastAPI REST API + dashboard
  Auth: Bearer token (ADMIN_API_TOKEN) for mutating endpoints
  Tests: pytest + pytest-asyncio + FastAPI TestClient + httpx

rules:
  proposal:
    - Include rollback plan for risky changes
    - Validate Bronze/Silver/Gold layer impact for data pipeline changes
    - Consider PostgreSQL vs Parquet source for data reads
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Align with Lakehouse layer boundaries
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    follow_existing: true
    tdd: true
    test_command: "pytest backend/tests/ -v --tb=short"
  verify:
    test_command: "pytest backend/tests/ -v --tb=short"
    build_command: "python -c \"from backend.app import app; print('Imports OK')\""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
